# WeChat to Obsidian 智能助手配置文件模板 (请复制为 config.yaml 并填入您的真实凭据)

# 1. 企业微信自建应用 / 微信客服配置
wechat:
  corp_id: "YOUR_CORP_ID"
  agent_id: 1000003
  secret: "YOUR_SECRET"
  token: "YOUR_TOKEN"
  encoding_aes_key: "YOUR_ENCODING_AES_KEY"
  open_kfid: "YOUR_OPEN_KFID"             # 微信客服账号 ID (可选)

# 2. 实时大模型请求：本机共享网关，OAuth 凭据不放在业务配置中
llm:
  enable: true
  base_url: "http://127.0.0.1:18890/v1"
  api_key: ""                              # 从 LLM_GATEWAY_KEY 环境变量读取
  model: "default"                          # 跟随网页「模型设置」中的全局默认模型
  temperature: 0.2
  proxy: null                              # 网关负责 Google 出口代理


# 3. 知乎平台抓取增强配置 (可选)
# 提示：若与 social_radar 部署在同一服务器，程序会自动复用 social_radar 的知乎 Cookie。
# 也可直接在微信中发送 `/cookie <完整Cookie>` 随时免登录热更新！
zhihu:
  cookie: ""                                 # 浏览器登录 zhihu.com 后的完整 Cookie (包含 z_c0, d_c0 等)
# 4. 云端同步 API 安全密钥 (用于本地 Obsidian 插件拉取笔记时的身份凭据)
sync:
  api_secret: "YOUR_CUSTOM_SYNC_SECRET_TOKEN"
  server_url: "http://your-server-domain.com"
  port: 8088                              # 服务端监听端口

# 5. 本地 Obsidian 归档设置
obsidian:
  vault_path: "D:/Obsidian/workspace"     # 您的 Obsidian 知识库绝对路径
  archive_mode: "daily"                   # "daily" 按日归档，或 "inbox" 单文件归档
  daily_folder: "10-Journal&Planning/13-note"
  inbox_file: "00-Inbox/Inbox.md"
  attachment_folder: "attachments"
  format_template: "bullet"
